[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gssc"
version = "1.0.0"
description = "Official PyTorch implementation of S2D2 (Structured Source Discrete Diffusion) -- 'Generative Semantic Scene Completion' (TPAMI 2026)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
authors = []
keywords = [
    "semantic-scene-completion",
    "discrete-diffusion",
    "lidar",
    "semantickitti",
    "autonomous-driving",
    "computer-vision",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "einops>=0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.24",
    "tensorboard>=2.16",
    # spconv: install separately, see docs/REPRODUCIBILITY.md
    # spconv-cu126==2.3.8
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "vulture>=2.11",
    "pyflakes>=3.2",
]
viz = [
    # Blender 3.6 LTS, headless, called via subprocess (not a pip package).
    "matplotlib>=3.8",
    "Pillow>=10.2",
    "drawsvg>=2.4",
]
wandb = [
    "wandb>=0.17",
]

[project.urls]
"Homepage" = "https://github.com/BillyChern/GSSC-S2D2"
"Issues" = "https://github.com/BillyChern/GSSC-S2D2/issues"
"Paper" = "https://arxiv.org/abs/TBD"

[project.scripts]
gssc-train = "gssc.cli.train:main"
gssc-eval = "gssc.cli.eval:main"
gssc-infer = "gssc.cli.infer:main"
gssc-download = "gssc.cli.download:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gssc"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored / legacy code is excluded from style enforcement; it is kept for
# auditability of the original training runs but not part of the public API.
extend-exclude = [
    "src/gssc/_improved_diffusion",            # OpenAI improved-diffusion fork
    "src/gssc/models/extras_*.py",              # legacy ablation-only modules
    "src/gssc/models/scene_unet*.py",           # legacy scene-UNet variants used by trainer
    "src/gssc/training/train_pyramid_*.py",     # legacy pyramid training scripts
    "src/gssc/training/pyramid_pipeline.py",
    "external/",                                # third-party (semantic_kitti_api)
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF"]
extend-ignore = [
    "B008",    # function call in default — common pytorch idiom
    "RUF012",  # mutable class attributes — irrelevant for nn.Module
    "RUF001",  # ambiguous unicode in strings — × ² ³ used for shapes
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF013",  # implicit Optional — torch ecosystem convention
    "B905",    # zip without strict — verbose for short pairs
    "RUF005",  # collection literal concat
    "RUF046",  # cast-to-int — explicit better than implicit here
    "RUF059",  # unused-unpacked — common for tuple destructuring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["E402"]                                 # sys.path manipulation before import
"src/gssc/inference/run_scpnet.py" = ["E402"]           # spconv monkey-patches before import
"src/gssc/training/train_scene_completion.py" = ["E402", "F401"]  # late imports + experimental optional deps
"src/gssc/models/bev_sparse_bev_net.py" = ["E402"]      # SCPNet vendored layout

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA GPU",
    "slow: takes more than 60 seconds",
    "data: requires SemanticKITTI data",
]
