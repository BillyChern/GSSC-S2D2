[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gssc"
version = "2.3.8"
description = "Official PyTorch implementation of S2D2 (Structured Source Discrete Diffusion) -- 'Generative Semantic Scene Completion'."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Shi Chen" },
    { name = "Weifeng Ge" },
]
keywords = [
    "semantic-scene-completion",
    "discrete-diffusion",
    "lidar",
    "semantickitti",
    "autonomous-driving",
    "computer-vision",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "einops>=0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.24",
    "tensorboard>=2.16",
    # spconv: install separately, see docs/REPRODUCIBILITY.md
    # spconv-cu126==2.3.8
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
    "pyflakes>=3.2",
    "pre-commit>=3.7",
]
viz = [
    # Blender 3.6 LTS, headless, called via subprocess (not a pip package).
    "matplotlib>=3.8",
    "Pillow>=10.2",
    "drawsvg>=2.4",
]
wandb = [
    "wandb>=0.17",
]
ps3 = [
    # Numba JIT for the PS³ HDL-64E ray-tracer fast path
    # (src/gssc/data/lidar_resampler_v2.py). Without it the resampler
    # silently falls back to the much slower pure-Python loop.
    "numba>=0.59",
]

[project.urls]
"Homepage" = "https://github.com/BillyChern/GSSC-S2D2"
"Issues" = "https://github.com/BillyChern/GSSC-S2D2/issues"
"Project page" = "https://billychern.github.io/GSSC-project-page/"
# Paper link added on acceptance (the manuscript is under review).

# No console-script entry points: the repository is driven through the
# self-contained driver scripts in ``scripts/`` (see README), e.g.
#   python scripts/train.py train/31k_mf
#   python scripts/eval.py  eval/val_1step --checkpoint <ckpt>
#   python scripts/infer.py infer/test_d4tta --checkpoint <ckpt> --output preds/
#   python scripts/download_assets.py --checkpoints
# Those scripts resolve the repo root relative to their own location, so they
# are not packaged as installed console entry points.

[tool.hatch.build.targets.wheel]
packages = ["src/gssc"]
# Hatch packages only *.py under src/gssc by default, so the third-party
# license NOTICE for the vendored improved-diffusion fork would be dropped
# from the wheel. Force-include it to keep the attribution shipping.
force-include = { "src/gssc/_improved_diffusion/NOTICE" = "gssc/_improved_diffusion/NOTICE" }

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored / legacy code is excluded from style enforcement; it is kept for
# auditability of the original training runs but not part of the public API.
extend-exclude = [
    "src/gssc/_improved_diffusion",            # OpenAI improved-diffusion fork
    "src/gssc/models/scene_unet*.py",           # legacy scene-UNet variants used by trainer
    "src/gssc/models/bev_*.py",                 # vendored BEV second-task pipeline
    "src/gssc/models/conditioning.py",          # vendored conditioning helpers
    "src/gssc/data/semantic_kitti_utils.py",    # vendored split + label utility
    "src/gssc/data/lidar_simulation.py",        # legacy ray-tracer (HDL-64E + Bresenham3D)
    "src/gssc/training/train_pyramid_*.py",     # legacy pyramid training scripts
    "src/gssc/training/train_bev_secondary.py", # vendored BEV-A trainer (legacy script)
    "src/gssc/training/pyramid_pipeline.py",
    "external/",                                # third-party (semantic_kitti_api)
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF"]
extend-ignore = [
    "B008",    # function call in default — common pytorch idiom
    "RUF012",  # mutable class attributes — irrelevant for nn.Module
    "RUF001",  # ambiguous unicode in strings — × ² ³ used for shapes
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF013",  # implicit Optional — torch ecosystem convention
    "B905",    # zip without strict — verbose for short pairs
    "RUF005",  # collection literal concat
    "RUF046",  # cast-to-int — explicit better than implicit here
    "RUF059",  # unused-unpacked — common for tuple destructuring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402"]                           # importorskip before package imports
"scripts/**" = ["E402"]                                 # sys.path manipulation before import
"src/gssc/inference/run_scpnet.py" = ["E402"]           # spconv monkey-patches before import
# I001: the S3DSKDDataset import sits INSIDE the block of `= None` sentinels deliberately,
# under the comment explaining that binding it there is what makes `train/31k_mf` run at all
# (left unbound, the loader silently enumerates ZERO samples). Sorting the block would hoist
# the import away from that explanation, so the placement is pinned here, not in the source.
"src/gssc/training/train_scene_completion.py" = ["E402", "F401", "I001"]  # late imports + experimental optional deps
"src/gssc/models/bev_sparse_bev_net.py" = ["E402"]      # SCPNet vendored layout

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA GPU",
    "slow: takes more than 60 seconds",
    "data: requires SemanticKITTI data",
]

[tool.mypy]
# Type-check only the public-API surface where annotations are complete.
# Legacy / vendored modules are intentionally out of scope; they are
# excluded from style enforcement too (see [tool.ruff] above).
python_version = "3.10"
files = [
    "src/gssc/inference/evaluate.py",
    "src/gssc/inference/evaluate_bev.py",
    "src/gssc/inference/d4_tta.py",
    "src/gssc/inference/generate_predictions.py",
    "src/gssc/utils",
]
exclude = [
    "src/gssc/inference/run_scpnet.py",  # vendored SCPNet wrapper
]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false           # spconv / torch return Any in many places
no_implicit_optional = true
check_untyped_defs = true
# Aspirational --strict knobs (toggled per-module as we tighten):
disallow_untyped_defs = false     # flip on per module via overrides below
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "gssc.inference.evaluate"
disallow_untyped_defs = true      # this module is fully typed

[[tool.mypy.overrides]]
module = "gssc.utils.config_loader"
disallow_untyped_defs = true      # this module is fully typed

[tool.coverage.run]
# Coverage targets the unit-testable subset: pure-Python helpers, parsers,
# config loaders, and small math invariants that run on CPU. The heavy
# GPU pipelines (full diffusion sampler, model forward, subprocess shells
# for the two-stage eval) are exercised by the V4 / V5 integration runs
# documented in docs/REPRODUCIBILITY.md rather than by pytest, since they
# require a GPU + 200 GB of SemanticKITTI data.
source = [
    "src/gssc/utils",
    "src/gssc/inference",
]
omit = [
    "src/gssc/inference/run_scpnet.py",            # vendored SCPNet wrapper
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main\\(",                                  # CLI entry, integration-tested
    "def run_evaluation\\(",                        # subprocess wrapper, V4-tested
    "raise FileNotFoundError",                      # thin error-translation wrappers
]
show_missing = true
skip_covered = false
fail_under = 80
