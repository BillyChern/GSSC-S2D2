name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-cpu:
    name: pytest (CPU, torch-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Enumerated instead of `pip install -e ".[dev]"` on purpose. Installing the
      # project pulls torch==2.4.0 and its CUDA wheels (~2.5 GB) into a job whose whole
      # point is to prove the package's light surface imports WITHOUT torch, and it
      # would hide a newly-added undeclared import behind a transitive install.
      #
      # These three are the only distributions repo code imports on this path:
      #   pyyaml -> gssc.utils.config_loader, gssc.inference.evaluate
      #   numpy  -> gssc.inference.evaluate_bev (module scope), gssc.utils.dw_iou
      # numpy's absence is why this job used to die AT COLLECTION on a clean runner
      # while staying green on a developer box that already had it.
      - name: Install the torch-free test dependencies
        run: pip install pytest "pyyaml>=6.0" "numpy>=1.26,<2"

      - name: Run the CPU-runnable test suite
        # What this badge covers, measured on a fresh python3.10 venv holding ONLY the
        # three distributions installed above: 42 tests execute, 34 skip, exit 0. The
        # whole suite is 116 cases, so this job runs 36 % of it; the remainder needs
        # torch 2.4 + spconv and is covered by the V4 / V5 integration runs in
        # docs/REPRODUCIBILITY.md. Every torch- or spconv-dependent file guards BOTH
        # imports with pytest.importorskip, so on this runner they skip instead of
        # erroring at collection -- guarding only torch is not enough, because the
        # d4_tta / generate_predictions / js3c_base modules reach spconv through
        # gssc.models.s2d2_unet and a collection error aborts the entire run.
        #
        # tests/test_tau_invariance.py is the one file that imports torch at module
        # scope without importorskip, so it cannot be collected in a torch-free job.
        # Dropping the --ignore needs the matching CONTRIBUTING.md "Tests" row to move
        # with it: that row quotes this command verbatim and .release_checks/
        # check_ci_honesty.py compares the two.
        run: |
          PYTHONPATH=src python -m pytest tests/ \
            --ignore=tests/test_tau_invariance.py \
            -v
