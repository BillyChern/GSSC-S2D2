name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-light:
    name: pytest (light, no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest pyyaml
      - name: Run light + parser tests
        run: |
          PYTHONPATH=src python -m pytest \
            tests/test_smoke.py::test_light_module_imports \
            tests/test_smoke.py::test_version \
            tests/test_config_loader.py \
            tests/test_evaluate_parser.py \
            -v
