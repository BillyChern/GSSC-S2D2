_paper_table: "same as js3c_val_paper.yaml (alias): supplementary tab:supp_b6_val's GT-BEV oracle row. NOT tab:portable_s2d2, which is derived BEV."
_description: |
  Alias of `js3c_val_paper.yaml` (identical in every consumed key), kept for
  v1.1.0-pre callers: N=1 Algo2 sampling with GT-BEV conditioning.

  GT BEV is a DIAGNOSTIC here. The paper's tabulated JS3C-Net + S2D2 numbers —
  24.3 % under the official semantic-kitti-api (tab:portable_s2d2, +1.6 pp over the
  22.7 % base) and 26.7 % under the internal training-time evaluator — are the SAME
  run under DERIVED BEV; run `js3c_val_realistic.yaml` for those. The 26.7/24.3
  difference is an evaluator gap, not a BEV-source gap.

  See `js3c_val_paper.yaml` for what this GT-BEV path does reproduce (supplementary
  tab:supp_b6_val's 61.8 % oracle row, with the separately trained GT-BEV
  checkpoint).
# Consumed by run_evaluation: split, sequences, base_pred_dir, bev_source,
# bev_root, correction_steps, tta. The remaining keys document the hardcoded
# protocol but are NOT read (base_kind: the JS3C base is selected via
# base_pred_dir; bev_from_base + cold_diffusion: always-on in the Algo2 path),
# so they are underscore-prefixed to preserve provenance while signalling inert.
split: val
sequences: "08"
_base_kind: js3c
base_pred_dir: data/js3cnet_predictions
bev_source: gt
bev_root: SemanticKITTI_3D/256
_bev_from_base: true
_cold_diffusion: true
correction_steps: 1
tta: none
