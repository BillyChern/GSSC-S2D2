_paper_table: "tab:portable_s2d2 (JS3C cross-base) + supplementary tab:supp_b6_val (paper protocol)"
_description: |
  JS3C-Net cross-base eval reproducing the paper tab:portable_s2d2 (JS3C row) protocol:
  N=1 Algo2 sampling with GT-BEV conditioning. See `js3c_val_paper.yaml` for
  the explicit protocol description and `js3c_val_realistic.yaml` for the
  realistic-deployment variant (derived BEV).

  Expected mIoU: ~26.7 % (paper claim 26.72 % under internal SSCMetrics;
  GSSC-S2D2 reports via official semantic-kitti-api which differs by the
  +0.31 pp internal/official gap documented in supplementary tab:supp_b6_val).

  This config is aliased to `js3c_val_paper.yaml` for backwards compatibility
  with v1.1.0-pre callers.
# Consumed by run_evaluation: split, sequences, base_pred_dir, bev_source,
# bev_root, correction_steps, tta. The remaining keys document the hardcoded
# protocol but are NOT read (base_kind: the JS3C base is selected via
# base_pred_dir; bev_from_base + cold_diffusion: always-on in the Algo2 path),
# so they are underscore-prefixed to preserve provenance while signalling inert.
split: val
sequences: "08"
_base_kind: js3c
base_pred_dir: data/js3cnet_predictions
bev_source: gt
bev_root: SemanticKITTI_3D/256
_bev_from_base: true
_cold_diffusion: true
correction_steps: 1
tta: none
