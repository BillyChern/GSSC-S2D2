_paper_table: tab:dwiou (Tab. VIII, DW-VRU-IoU under reaction-time budgets)
_description: |
  DW-VRU-IoU across reaction windows. NOTE: this is a DERIVED quantity, not a separate
  evaluation -- DW-IoU_c = 1 - (1 - IoU_c)^(rate * t_w) is a function of the per-class IoU an
  eval already reports and each system's measured end-to-end rate. There is nothing extra to
  run on the GPU, which is why no metric named dwiou exists in eval.py.

  Two steps. First get the per-class VRU IoUs for the row you want:

    python scripts/eval.py eval/val_1step --checkpoint <ckpt> --metrics per_class \
        --output metrics.json

  then derive the windows at that row's deployed rate:

    python -m gssc.utils.dw_iou --metrics-json metrics.json --rate 3.23

  Rates are the measured end-to-end FPS of Tab. VIII, not the refiner's marginal rate:
  base 4.95, N=1 3.23, N=4 1.58, N=10 0.78, N=100 0.09. The N>1 rows of that table hold
  per-class IoU at its N=1 value and vary only the rate, so they isolate the latency term and
  are projections rather than fresh measurements.

  tests/test_dw_iou.py checks the derivation against all 20 published cells.

  DW-IoU assumes independent frames. Consecutive single-frame predictions are correlated, so
  it is an optimistic upper bound on the benefit of a faster refresh, not a detection
  probability.
split: val
sequences: "08"
correction_steps: 1
tta: none
metrics: [per_class]
