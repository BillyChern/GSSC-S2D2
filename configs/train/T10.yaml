_paper_table: tab:train_timesteps_curriculum (T=10 row)
_description: Training-timestep schedule ablation T=10.
data_root: data
model_type: sparse_full
s3_mode: teacher
scpnet_pred_dir: data/scpnet_predictions
bev_from_base: true
cold_diffusion: true
train_sequences: "00,01,02,03,04,05,06,07,09,10,synthetic"
diffusion_version: v2
loss_type: kl
batch_size: 4
lr: 1.0e-4
num_iterations: 100000
ssc_lovasz_weight: 0.3
auxiliary_loss_weight: 0.0005
algo2_eval_steps: 100
save_interval: 5000
# DEGENERATE CONFIG -- see configs/eval/timestep_ablation.yaml before using.
# beta_max stays 0.1 (the code default) regardless of T, so abar_T = prod(1-beta)
# = 0.595 here: the forward process covers only ~40% of the distance from x_0 to
# x_src and NEVER reaches the structured source. The correction sampler also
# hard-codes t=99, which this model (max t = 9) never trained on. The paper
# reports this row without interpreting it (supp Tab. XII, dagger note).
num_timesteps: 10
