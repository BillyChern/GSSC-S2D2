_paper_table: "tab:ablations, training-path block — the `trained only at t=T` row (32.74)"
_description: >
  Loss-matched one-step control: train the headline model at a single diffusion
  timestep t=99=T-1 instead of t ~ Uniform{0..99}.

  This file is `train/31k_mf.yaml` with exactly ONE change (see the block at the
  bottom). Everything else — model, optimiser, LR, batch size, iteration budget, EMA
  decay, the synthetic pool, the base predictions, and the ENTIRE V2 loss suite (KL
  posterior + focal gamma=2 + effective-number class balancing capped 20x +
  occupied_weight=10 + obs_weight_factor=2 + Lovasz 0.3 + auxiliary 0.0005) — is
  identical to the headline recipe.

  Why the timestep is the only thing varied. The paper's other one-step arm, the
  supervised refiner, differs from the headline in BOTH the training path AND the
  loss: it runs `--direct_prediction`, whose loss is plain `CE(class_0=0.02) +
  0.3*Lovasz` (train_scene_completion.py, `_train_step_direct`), with no focal term,
  no class balancing and no occupancy weighting. Holding the loss fixed and varying
  only the timestep distribution separates the two.

  At t=99 the forward process puts x_t within O(abar_T)=O(5.6e-3) of x_src, so this
  run trains on essentially the deployed input and predicts x_0 from it in one step:
  a supervised refiner carrying the headline objective.

  Measured result: 32.74% val mIoU on seq. 08 at step_40000 under the official
  semantic-kitti-api (completion IoU 36.93, precision 46.52, recall 64.18), against
  the matched full-schedule arm's 38.1% at the same budget and the 36.17% base it
  was handed. step_40000 is the budget-matched comparison because it is the headline
  checkpoint's step; the run continues to 100K so the control can also be given the
  headline's own selection procedure (best EMA val mIoU).

data_root: data
model_type: sparse_full
s3_mode: teacher
scpnet_pred_dir: data/scpnet_predictions
bev_from_base: true
cold_diffusion: true
train_sequences: "00,01,02,03,04,05,06,07,09,10,synthetic"
diffusion_version: v2
loss_type: kl
batch_size: 4
lr: 1.0e-4
num_iterations: 100000
ssc_lovasz_weight: 0.3
auxiliary_loss_weight: 0.0005
algo2_eval_steps: 100
save_interval: 5000
num_timesteps: 100

# ---- the single deviation from train/31k_mf.yaml ----
train_timesteps_mode: subset
train_timesteps_list: "99"
