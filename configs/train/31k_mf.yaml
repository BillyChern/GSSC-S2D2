_paper_table: "tab:main_results and tab:perclass_delta (headline)"
_description: "31K-MF: SCPNet base + 31K synthetic + multi-frame LiDAR. The headline configuration that yields 38.54% val mIoU and 39.2% test mIoU (D4 TTA)."
data_root: data
model_type: sparse_full
s3_mode: teacher
scpnet_pred_dir: data/scpnet_predictions
bev_from_base: true
cold_diffusion: true
train_sequences: "00,01,02,03,04,05,06,07,09,10,synthetic"
diffusion_version: v2
loss_type: kl
batch_size: 4  # The recipe verified to converge to within ~0.5% of the paper's
               # 38.54% headline on the migrated codebase: V3 retrain at
               # batch_size=4 + seed=42 reached 38.05% val 1-step (Δ=−0.49%
               # from headline). The original Exp1_scpnet_synth_BEV training
               # was at BS=2 unseeded (memory-sharing convention at the time);
               # that exact trajectory is not bit-reproducible, but BS=4 with
               # a fixed seed converges in distribution to the paper number.
lr: 1.0e-4
num_iterations: 100000
ssc_lovasz_weight: 0.3
auxiliary_loss_weight: 0.0005
algo2_eval_steps: 100  # CLI flag the trainer's argparse accepts; the trainer
                       # body falls back to this key when correction_eval_steps
                       # is absent.
save_interval: 5000
