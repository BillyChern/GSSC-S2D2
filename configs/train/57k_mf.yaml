_paper_table: tab:step_reduction (57K MF, paragraph)
_description: 57K multi-frame retrain. Documented as a negative result - more synthetic data does NOT help.
data_root: data
model_type: sparse_full
s3_mode: teacher
scpnet_pred_dir: data/scpnet_predictions
bev_from_base: true
cold_diffusion: true
# POOL SELECTION IS IMPLICIT -- read this before running.
# The "synthetic" entry below resolves to <data_root>/sequences/synthetic/voxels,
# a single fixed path. Nothing in this file selects the 57K pool over the 31K one:
# this config and 31k_mf.yaml request the SAME directory. The 31K/57K distinction
# was made by physically swapping the contents of that directory between runs.
# To reproduce this row you must populate sequences/synthetic/ with the 57,650-scene
# pool first; otherwise you will silently re-run the 31K configuration.
train_sequences: "00,01,02,03,04,05,06,07,09,10,synthetic"
diffusion_version: v2
loss_type: kl
batch_size: 4
lr: 1.0e-4
num_iterations: 100000
ssc_lovasz_weight: 0.3
auxiliary_loss_weight: 0.0005
algo2_eval_steps: 100
save_interval: 5000
