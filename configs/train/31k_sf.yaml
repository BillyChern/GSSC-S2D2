_paper_table: tab:data_scaling (the 31K entry of the synthetic-pool scaling sweep)
#              The single-frame step-reduction sweep this config used to claim is not
#              tabulated in the paper; the tabulated sweep is tab:step_reduction, which
#              is the multi-frame headline checkpoint, not this run.
_description: 31K single-frame retrain. Used for the data-scaling table.
data_root: data
model_type: sparse_full
s3_mode: teacher
scpnet_pred_dir: data/scpnet_predictions
bev_from_base: true
cold_diffusion: true
force_single_frame_lidar: true
train_sequences: "00,01,02,03,04,05,06,07,09,10,synthetic_31k"
diffusion_version: v2
loss_type: kl
batch_size: 4
lr: 1.0e-4
num_iterations: 100000
ssc_lovasz_weight: 0.3
auxiliary_loss_weight: 0.0005
algo2_eval_steps: 100
save_interval: 5000
