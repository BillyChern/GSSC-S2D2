# Pre-commit hooks for GSSC-S2D2.
#
# Install:
#   uv pip install pre-commit
#   pre-commit install
#
# Manually run on the whole repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(external|src/gssc/_improved_diffusion)/
      - id: end-of-file-fixer
        exclude: ^(external|src/gssc/_improved_diffusion)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev, pyproject's dev extra (`ruff==0.15.12`) and
    # .github/workflows/lint.yml on the SAME version -- lint results are
    # version-dependent. Measured on this tree: v0.6.9 aborts at config parse
    # ("Unknown rule selector: `RUF046`", the selector pyproject's extend-ignore
    # names), v0.12.12 reports 4 UP038 errors, v0.15.12 prints "All checks
    # passed!".
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Legacy modules are excluded via pyproject.toml's [tool.ruff]
        # extend-exclude, but that exclusion does NOT bound the blast radius:
        # the tree that remains has never been formatted. Measured 2026-08-23
        # with ruff 0.15.13, `ruff format --check src/ tests/ scripts/` reports
        # 63 of 74 files would be reformatted. On a normal commit the hook only
        # touches the files you changed, which is the intent; the documented
        # `pre-commit run --all-files`, however, will rewrite most of the repo.
        # Run that deliberately, in its own formatting commit.

  - repo: local
    hooks:
      - id: pytest-light
        name: pytest (light, no torch)
        entry: env PYTHONPATH=src python -m pytest
        language: system
        pass_filenames: false
        args:
          - tests/test_smoke.py::test_light_module_imports
          - tests/test_smoke.py::test_version
          - tests/test_config_loader.py
          - tests/test_evaluate_parser.py
          - -q
        stages: [pre-commit]

      - id: forbid-claude-attribution
        name: forbid Claude/AI attribution in commits
        entry: scripts/check_no_ai_attribution.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
